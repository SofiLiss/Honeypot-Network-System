- name: Настройка хоста администратора
  hosts: adminhost
  become: true
  tasks:
      - name: Создание конфигурации для ПРИЁМА логов (сервер)
        copy:
          dest: /etc/rsyslog.d/server.conf
          content: |
            module(load="imtcp")
            input(type="imtcp" port="514")
            $template RemoteLogs,"/var/log/honeypots/%HOSTNAME%/%PROGRAMNAME%.log"
            *.* ?RemoteLogs
            & stop
          mode: '0644'
        notify: restart rsyslog

      - name: Настройка rsyslog для создания директорий
        lineinfile:
          path: /etc/rsyslog.conf
          line: '$CreateDirs on'
          state: present
        notify: restart rsyslog

      - name: Создание директории для хранения логов ханипотов
        file:
          path: /var/log/honeypots
          state: directory
          owner: syslog
          group: adm
          mode: '0755'

      - name: Открытие порта 514 в фаерволе 
        ufw:
          rule: allow
          port: '514'
          proto: tcp
        when: ansible_facts.os_family == "Debian"
        ignore_errors: yes

  handlers:
    - name: restart rsyslog
      service:
        name: rsyslog
        state: restarted
        enabled: yes

- name: Общая настройка для всех хостов
  hosts: all
  become: true
  tasks:
    - name: Установка зависимостей для Docker
      apt:
        name: "{{item}}"
        state: present
        update_cache: yes
      loop:
        - apt-transport-https
        - ca-certificates
        - curl
        - gnupg-agent
        - software-properties-common

    - name: Добавление официального GPG ключа Docker
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Добавление репозитория Docker
      apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/{{ ansible_distribution | lower }} {{ ansible_distribution_release }} stable"
        state: present

    - name: Установка Docker
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
        state: latest

    - name: Установка Docker модуля для Python
      apt:
        name: python3-docker
        state: present

    - name: Добавление пользователя vagrant в группу docker
      user:
        name: vagrant
        groups: docker
        append: yes

    - name: Перенастройка SSH сервера на порт 2222
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?Port '
        line: 'Port 2222'
      notify: restart_ssh

    - name: Обновление порта для текущей сессии
      set_fact:
        ansible_port: 2222

    - name: Установка rsyslog
      apt:
        name: rsyslog
        state: present
        update_cache: yes
    
  handlers:
  - name: restart_ssh
    systemd:
      name: ssh
      state: restarted
