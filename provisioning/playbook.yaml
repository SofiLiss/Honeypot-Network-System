---

- name: Настрока не админиских хостов
  hosts: all:!adminhost
  become: true
  tasks:
    - name: Создание папки для монтирования
      ansible.builtin.file:
        path: /home/{{ ansible_user_id }}/honeylogs
        state: directory
        mode: '0777'

    - name: Создание файла для сбора логов с контейнера
      ansible.builtin.file:
        path: /home/{{ ansible_user_id }}/honeylogs/ssh_logs.log
        state: touch
        mode: '0666'

    - name: Сборка образа SSH-ханипота из Dockerfile
      community.docker.docker_image:
        name: my_ssh_honeypot
        build:
          path: ./path/to/ssh_honeypot_folder
        source: build

    - name: Запуск SSH контейнера на порту 22
      docker_container:
        name: ssh_honeypot
        image: my_ssh_honeypot
        state: started
        restart_policy: always
        ports:
          - "22:22"
        volumes:
          - "/home/{{ ansible_user_id }}/honeylogs/ssh_logs.log:/app/ssh_honeypot.log"
    
    - name: Создание конфигурации для отправки логов
      copy:
        dest: /etc/rsyslog.d/honeypot.conf
        content: |
          module(load="imfile" Mode="inotify")

          # Указываем следить за лог-файлом ханипота
          input(type="imfile"
            File="/home/{{ ansible_user_id }}/honeylogs/ssh_logs.log"
            Tag="honeypot"
            Severity="info"
            Facility="local7")

          # Отправляем всё на центральный сервер по TCP
          action(type="omfwd"
            Target="192.168.56.30"
            Port="514"
            Protocol="tcp"
            queue.type="linkedList"
            queue.size="10000")
        mode: '0644'
          
- name: Настройка MySQL сервера
  hosts: mysqlserv
  become: true
  tasks:
    - name: Установка MySQL сервера
      apt:
        name:
          - mysql-server
          - mysql-client
        state: present
        update_cache: yes

    - name: Изменение порта MySQL в конфигурации
      lineinfile:
        path: /etc/mysql/mysql.conf.d/mysqld.cnf
        regexp: '^#?port\s*='
        line: 'port = 3333'
      notify: restart_mysql

    - name: Запуск MySQL сервера
      systemd:
        name: mysql
        state: started
        enabled: yes

    - name: Создание папки для монтирования
      ansible.builtin.file:
        path: /home/{{ ansible_user_id }}/honeylogs
        state: directory
        mode: '0777'

    - name: Создание файла для сбора логов с контейнера
      ansible.builtin.file:
        path: /home/{{ ansible_user_id }}/honeylogs/mysql_logs.log
        state: touch
        mode: '0666'


    - name: Сборка образа mysql-ханипота из Dockerfile
      community.docker.docker_image:
        name: my_mysql_honeypot
        build:
          path: ./path/to/mysql_honeypot_folder
        source: build

    - name: Запуск MySQL контейнера на порту 3306
      docker_container:
        name: mysql_honeypot
        image: my_mysql_honeypot
        state: started
        restart_policy: always
        ports:
          - "3306:3306"
        volumes:
          - "/home/{{ ansible_user_id }}/honeylogs/mysql_logs.log:/app/mysql_honeypot.log"
        env:
          MYSQL_ROOT_PASSWORD: "rootpassword"
          MYSQL_DATABASE: "appdb"
          MYSQL_USER: "appuser"
          MYSQL_PASSWORD: "apppassword"
        networks:
          - name: bridge

    - name: Создание конфигурации для отправки логов
      copy:
        dest: /etc/rsyslog.d/honeypot.conf
        content: |
          module(load="imfile" Mode="inotify")

          # Указываем следить за лог-файлом ханипота
          input(type="imfile"
            File="/home/{{ ansible_user_id }}/honeylogs/mysql_logs.log"
            Tag="honeypot"
            Severity="info"
            Facility="local7")

          # Отправляем всё на центральный сервер по TCP
          action(type="omfwd"
            Target="192.168.56.30"
            Port="514"
            Protocol="tcp"
            queue.type="linkedList"
            queue.size="10000")
        mode: '0644'
      notify: restart rsyslog
    
  handlers:
    - name: restart rsyslog
      service:
        name: rsyslog
        state: restarted
        enabled: yes
    
    - name: restart mysql
      service:
        name: MySQL
        state: restarted
        enabled: yes


