name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: MegaLinter
        uses: oxsecurity/megalinter/flavors/documentation@v7
        env:
          ENABLE_LINTERS: ANSIBLE_ANSIBLE_LINT,DOCKERFILE_HADOLINT,BASH_SHELLCHECK
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload MegaLinter reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: megalinter-reports
          path: |
            megalinter-reports/
            mega-linter.log
          retention-days: 7

  smoke-test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
        matrix:
          include:
            - compose: ci-compose/vmWS-ssh-telnet.yaml
              ports: "2222 23"
            - compose: ci-compose/vmDB-ssh-mysql.yaml
              ports: "2222 3306"
              
    steps:
        - uses: actions/checkout@v4

        - name: Start containers
          run: docker compose -f ${{ matrix.compose }} up -d --wait
          continue-on-error: true

        - name: Debug container health
          if: always()
          run: |
            docker compose -f ${{ matrix.compose }} ps
            for id in $(docker compose -f ${{ matrix.compose }} ps -q); do
              echo "=== $id ==="
              docker inspect --format='{{json .State.Health}}' "$id" | python3 -m json.tool || true
              docker logs "$id"
            done

        - name: Check open ports
          run: |
            for port in ${{ matrix.ports }}; do nc -zv localhost $port; done
  
  build-and-push:
    needs: smoke-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: ssh-honeypot
            context: docker/ssh-server
          - image: telnet-honeypot
            context: docker/telnet-server
          - image: mysql-honeypot
            context: docker/sql-server
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/sofiliss/${{ matrix.image }}:latest
            ghcr.io/sofiliss/${{ matrix.image }}:${{ github.sha }}