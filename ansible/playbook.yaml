---
- name: Detect active SSH port and configure hosts
  hosts: all_hosts
  gather_facts: false
  become: true
  pre_tasks:
    - name: Load port detection
      ansible.builtin.import_tasks: "{{ playbook_dir }}/detect_ports.yaml"

- name: Configure all hosts (Rsyslog and SSH port)
  hosts: all_hosts
  become: true
  tasks:
    - name: Install rsync on worker hosts
      ansible.builtin.apt:
        name: rsync
        state: present
        update_cache: yes

    - name: Change SSH port in sshd_config
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?Port\s+'
        line: 'Port {{ ssh_port }}'
        state: present

    - name: Restart SSH service
      ansible.builtin.service:
        name: ssh
        state: restarted
      async: 1        
      poll: 0

    - name: Dynamically update Ansible SSH port
      ansible.builtin.set_fact:
        ansible_port: "{{ ssh_port }}"

- name: Setup Docker and Container logging on non-admin hosts
  hosts: all_hosts:!adminhost
  become: true
  gather_facts: false
  pre_tasks:
    - name: Load port detection
      ansible.builtin.import_tasks: "{{ playbook_dir }}/detect_ports.yaml"
  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install Docker and prerequisites from repository
      ansible.builtin.apt:
        name:
          - docker.io
          - containerd
          - python3-docker
          - apt-transport-https
          - ca-certificates
          - curl
          - docker-compose-v2
        state: present

    - name: Add admin user to docker group
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes

    - name: Ensure Docker service is running
      ansible.builtin.service:
        name: docker
        state: started
        enabled: yes

    - name: Wait for Docker socket to be available
      ansible.builtin.wait_for:
        path: /var/run/docker.sock
        timeout: 30

    - name: Create directory for container custom logs on host
      ansible.builtin.file:
        path: "{{ log_dir }}"
        state: directory
        mode: '0777'

  handlers:
    - name: Restart Rsyslog
      ansible.builtin.service:
        name: rsyslog
        state: restarted

- name: Deploy honeypot containers via Docker Compose
  hosts: all_hosts:!adminhost
  become: true
  gather_facts: false
  pre_tasks:
    - name: Load port detection
      ansible.builtin.import_tasks: "{{ playbook_dir }}/detect_ports.yaml"
  tasks:
    - name: Ensure docker build directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ docker_build_dir }}"
        - "/opt/docker"

    - name: Copy combo compose file to host
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../ci-compose/{{ docker_combo }}"
        dest: "{{ docker_build_dir }}/docker-compose.yml"
        mode: '0644'
        
    - name: Copy .env file to host
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../.env.example" 
        dest: "{{ docker_build_dir }}/.env"
        mode: '0600' 
        
    - name: Copy docker build contexts
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../docker/"
        dest: "/opt/docker/"
        mode: '0755'

    - name: Start containers via Docker Compose
      community.docker.docker_compose_v2:
        project_src: "{{ docker_build_dir }}"
        env_files:
          - "{{ docker_build_dir }}/.env"
        state: present

- name: Generate rsync SSH key on adminhost
  hosts: adminhost
  become: true
  tasks:
    - name: Ensure .ssh directory exists for root
      ansible.builtin.file:
        path: /root/.ssh
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Generate SSH key for rsync (Root)
      community.crypto.openssh_keypair:
        path: /root/.ssh/id_rsa_rsync_root
        type: rsa
        size: 2048
        state: present
        owner: root
        group: root

    - name: Read public key into variable
      ansible.builtin.slurp:
        src: /root/.ssh/id_rsa_rsync_root.pub
      register: rsync_pubkey_root

- name: Authorize adminhost key on worker hosts
  hosts: all_hosts:!adminhost
  become: true
  gather_facts: false
  pre_tasks:
    - name: Load port detection
      ansible.builtin.import_tasks: "{{ playbook_dir }}/detect_ports.yaml"
  tasks:
    - name: Add adminhost ROOT public key to root authorized_keys
      ansible.builtin.authorized_key:
        user: root 
        key: "{{ hostvars['adminhost']['rsync_pubkey_root']['content'] | b64decode }}"
        state: present

- name: Configure log collection on adminhost
  hosts: adminhost
  become: true
  tasks:
    - name: Create directories for remote logs
      ansible.builtin.file:
        path: /var/log/remote/{{ item }}
        state: directory
        mode: '0755'
        owner: root
        group: root
      loop: "{{ groups['all_hosts'] | difference(['adminhost']) }}"

    - name: Add cron job to pull logs from each host (as Root)
      ansible.builtin.cron:
        name: "Pull logs from {{ item }}"
        minute: "*/5"
        user: root
        job: "rsync -az --delete -e 'ssh -p {{ ssh_port }} -i /root/.ssh/id_rsa_rsync_root -o StrictHostKeyChecking=no' root@{{ hostvars[item]['ansible_host'] }}:{{ log_dir }}/ /var/log/remote/{{ item }}/ >> /var/log/rsync_{{ item }}.log 2>&1"
      loop: "{{ groups['all_hosts'] | difference(['adminhost']) }}"
